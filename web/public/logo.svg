<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glassPlate" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
      x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="sdfA"/>
      <feGaussianBlur in="sdfA" stdDeviation="2" result="sdf"/>
      <feDiffuseLighting in="sdf" diffuseConstant="1" surfaceScale="5.5" lighting-color="#ffffff" result="raw">
        <feDistantLight azimuth="225" elevation="52"/>
      </feDiffuseLighting>
      <feGaussianBlur in="raw" stdDeviation="1" result="rawSmooth"/>
      <feComponentTransfer in="rawSmooth" result="t">
        <feFuncR type="linear" slope="0.78" intercept="0.22"/>
        <feFuncG type="linear" slope="0.78" intercept="0.22"/>
        <feFuncB type="linear" slope="0.78" intercept="0.22"/>
      </feComponentTransfer>
      <feComponentTransfer in="t" result="color">
        <feFuncR type="table" tableValues="0.102 0.22"/>
        <feFuncG type="table" tableValues="0.071 0.15"/>
        <feFuncB type="table" tableValues="0.157 0.32"/>
      </feComponentTransfer>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>

    <filter id="ssaoBg" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
      x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blurA"/>
      <feGaussianBlur in="blurA" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="-0.8" dy="1.8" result="off"/>
      <feFlood flood-color="#0c041c" flood-opacity="0.78" result="flood"/>
      <feComposite in="flood" in2="off" operator="in"/>
    </filter>

    <filter id="twoMaskBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feOffset in="blur" dx="-5" dy="1.2"/>
    </filter>

    <mask id="twoOccMask" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="black"/>
      <g transform="translate(47 18) scale(0.88) translate(-20 -21.05)" filter="url(#twoMaskBlur)">
        <use href="#twoShape" stroke="white" stroke-width="22" fill="none"/>
      </g>
    </mask>

    <filter id="sdfNabla" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
      x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="sdfA"/>
      <feGaussianBlur in="sdfA" stdDeviation="2" result="sdf"/>
      <feDiffuseLighting in="sdf" diffuseConstant="1.1" surfaceScale="3.2" lighting-color="#ffffff" result="rawView">
        <feDistantLight azimuth="0" elevation="88"/>
      </feDiffuseLighting>
      <feGaussianBlur in="rawView" stdDeviation="1" result="viewSmooth"/>
      <feComponentTransfer in="viewSmooth" result="ndotv">
        <feFuncR type="linear" slope="0.9" intercept="0.08"/>
        <feFuncG type="linear" slope="0.9" intercept="0.08"/>
        <feFuncB type="linear" slope="0.9" intercept="0.08"/>
      </feComponentTransfer>
      <feComponentTransfer in="ndotv" result="t">
        <feFuncR type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
        <feFuncG type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
        <feFuncB type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
      </feComponentTransfer>
      <feComponentTransfer in="t" result="color">
        <feFuncR type="table" tableValues="1 0.96"/>
        <feFuncG type="table" tableValues="0.42 0.82"/>
        <feFuncB type="table" tableValues="0.28 0.12"/>
      </feComponentTransfer>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>

    <filter id="sdfNablaOcc" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
      x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="sdfA"/>
      <feGaussianBlur in="sdfA" stdDeviation="2" result="sdf"/>
      <feDiffuseLighting in="sdf" diffuseConstant="1.1" surfaceScale="3.2" lighting-color="#ffffff" result="rawView">
        <feDistantLight azimuth="0" elevation="88"/>
      </feDiffuseLighting>
      <feGaussianBlur in="rawView" stdDeviation="1" result="viewSmooth"/>
      <feComponentTransfer in="viewSmooth" result="ndotv">
        <feFuncR type="linear" slope="0.9" intercept="0.08"/>
        <feFuncG type="linear" slope="0.9" intercept="0.08"/>
        <feFuncB type="linear" slope="0.9" intercept="0.08"/>
      </feComponentTransfer>
      <feComponentTransfer in="ndotv" result="t">
        <feFuncR type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
        <feFuncG type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
        <feFuncB type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
      </feComponentTransfer>
      <feFlood flood-color="rgb(0.32 0.32 0.32)" result="tCap"/>
      <feBlend in="t" in2="tCap" mode="darken" result="tOcc"/>
      <feComponentTransfer in="tOcc" result="color">
        <feFuncR type="table" tableValues="1 0.96"/>
        <feFuncG type="table" tableValues="0.42 0.82"/>
        <feFuncB type="table" tableValues="0.28 0.12"/>
      </feComponentTransfer>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>

    <filter id="sdfTwo" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse"
      x="0" y="0" width="64" height="64" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.84" result="sdfA"/>
      <feGaussianBlur in="sdfA" stdDeviation="0.84" result="sdf"/>
      <feDiffuseLighting in="sdf" diffuseConstant="1" surfaceScale="2" lighting-color="#ffffff" result="rawView">
        <feDistantLight azimuth="0" elevation="88"/>
      </feDiffuseLighting>
      <feGaussianBlur in="rawView" stdDeviation="0.7" result="viewSmooth"/>
      <feComponentTransfer in="viewSmooth" result="ndotv">
        <feFuncR type="linear" slope="0.92" intercept="0.06"/>
        <feFuncG type="linear" slope="0.92" intercept="0.06"/>
        <feFuncB type="linear" slope="0.92" intercept="0.06"/>
      </feComponentTransfer>
      <feComponentTransfer in="ndotv" result="t">
        <feFuncR type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
        <feFuncG type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
        <feFuncB type="table" tableValues="0.96 0.88 0.76 0.58 0.34"/>
      </feComponentTransfer>
      <feComponentTransfer in="t" result="color">
        <feFuncR type="table" tableValues="0.52 1"/>
        <feFuncG type="table" tableValues="0.20 0.32"/>
        <feFuncB type="table" tableValues="0.82 0.74"/>
      </feComponentTransfer>
      <feComposite in="color" in2="SourceAlpha" operator="in"/>
    </filter>

    <path id="nablaRing" fill-rule="evenodd" d="
      M 24 19.03
      L 40 19.03
      Q 51 19.03 45.5 28.556
      L 37.5 42.414
      Q 32 51.94 26.5 42.414
      L 18.5 28.556
      Q 13 19.03 24 19.03
      Z
      M 29.9 26.71
      L 34.1 26.71
      Q 37.7 26.71 35.9 29.828
      L 33.8 33.464
      Q 32 36.582 30.2 33.464
      L 28.1 29.828
      Q 26.3 26.71 29.9 26.71
      Z
    "/>
    <path id="twoShape" fill="none" stroke="white" stroke-width="6"
      stroke-linecap="round" stroke-linejoin="round" d="
      M 13.12 16.24
      C 12.12 12.0 27.88 11.7 27.54 18.5
      C 27.06 22.16 16.06 24.44 13.6 28
      Q 14 30.4 16.2 30.4
      L 26.88 30.4
    "/>

  </defs>

  <rect width="64" height="64" rx="16" fill="#1a1228" filter="url(#glassPlate)"/>

  <g opacity="1">
    <g transform="translate(29 35) scale(1.18) translate(-32 -30)">
      <use href="#nablaRing" fill="black" filter="url(#ssaoBg)"/>
    </g>
    <g transform="translate(47 18) scale(0.88) translate(-20 -21.05)">
      <use href="#twoShape" stroke="black" stroke-width="6.8" fill="none" filter="url(#ssaoBg)"/>
    </g>
  </g>

  <g transform="translate(29 35) scale(1.18) translate(-32 -30)">
    <use href="#nablaRing" fill="white" filter="url(#sdfNabla)"/>
  </g>
  <g transform="translate(29 35) scale(1.18) translate(-32 -30)" mask="url(#twoOccMask)">
    <use href="#nablaRing" fill="white" filter="url(#sdfNablaOcc)"/>
  </g>

  <g transform="translate(47 18) scale(0.88) translate(-20 -21.05)">
    <use href="#twoShape" filter="url(#sdfTwo)"/>
  </g>
</svg>
