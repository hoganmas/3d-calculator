<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laplacian</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Latin Modern = Computer Modern OpenType (standard LaTeX text face) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sugina-dev/latin-modern-web@1.0.1/style/latinmodern-roman.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1014;
        --panel: #161a22;
        --stroke: #2a3140;
        --text: #e8eaed;
        --muted: #9aa3b2;
        --accent: #6ea8fe;
        --ok: #3dd68c;
        --warn: #f5a524;
        --panel-w: 360px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: Georgia, "Times New Roman", Times, serif;
        background: var(--bg);
        color: var(--text);
      }
      #panel {
        background: var(--panel);
        padding: 12px 12px 16px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      #app {
        display: grid;
        grid-template-columns: var(--panel-w) 5px 1fr;
        height: 100%;
      }
      #panelResize {
        cursor: col-resize;
        background: var(--stroke);
        position: relative;
        z-index: 3;
        touch-action: none;
      }
      #panelResize::after {
        content: "";
        position: absolute;
        inset: 0 -3px;
      }
      #panelResize:hover,
      #panelResize.dragging {
        background: var(--accent);
      }
      body.panel-resizing {
        cursor: col-resize;
        user-select: none;
      }
      body.panel-resizing #viewport,
      body.panel-resizing #viewport * {
        pointer-events: none;
      }
      .expr-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 -4px;
      }
      .expr-row {
        display: grid;
        grid-template-columns: 28px 1fr 28px 28px;
        gap: 0;
        align-items: stretch;
        min-height: 52px;
        padding: 0;
        border-radius: 6px;
        border: 1px solid var(--stroke);
        background: transparent;
        overflow: hidden;
      }
      .expr-row.selected {
        border-color: rgba(110, 168, 254, 0.55);
        box-shadow: 0 0 0 1px rgba(110, 168, 254, 0.2);
      }
      .expr-row.is-hidden {
        opacity: 0.45;
      }
      .expr-row.is-hidden .expr-color {
        opacity: 0.5;
      }
      .expr-color {
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        border: none;
        border-right: 1px solid var(--stroke);
        border-radius: 0;
        background: transparent;
        cursor: pointer;
        align-self: stretch;
      }
      .expr-mid {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 100%;
      }
      .expr-field {
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 52px;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        padding: 8px 10px;
      }
      .expr-field:focus-within {
        border: none !important;
        box-shadow: none !important;
      }
      .expr-del {
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        font-size: 16px;
        line-height: 1;
        border: none;
        border-left: 1px solid var(--stroke);
        border-radius: 0;
        background: transparent;
        align-self: stretch;
      }
      .expr-del:hover {
        background: rgba(227, 93, 106, 0.12);
        color: #ff7b72;
      }
      .expr-vis {
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        border: none;
        border-left: 1px solid var(--stroke);
        border-radius: 0;
        background: transparent;
        align-self: stretch;
        color: var(--muted);
        display: grid;
        place-items: center;
      }
      .expr-vis:hover {
        color: var(--text);
        background: rgba(110, 168, 254, 0.1);
      }
      .expr-vis svg {
        width: 14px;
        height: 14px;
        display: block;
      }
      .expr-vis.is-off {
        color: var(--stroke);
      }
      #panel .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 2px 0 0;
      }
      #panel .brand-mark {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 8px;
      }
      #panel h1 {
        font-family: "Latin Modern Roman", "Computer Modern Serif", Georgia, serif;
        font-size: 26px;
        font-weight: bold;
        margin: 0;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }
      #panel .brand-sub {
        margin: 2px 0 4px 48px;
        font-family: "Latin Modern Roman", "Computer Modern Serif", Georgia, serif;
        font-size: 12px;
        color: var(--muted);
      }
      #panel p {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input,
      select,
      textarea,
      math-field,
      button {
        font: inherit;
        font-size: 13px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        padding: 8px 10px;
      }
      #panel input,
      #panel select,
      #panel textarea,
      #panel math-field,
      #panel button.secondary {
        background: transparent;
      }
      textarea {
        min-height: 64px;
        resize: vertical;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
      }
      math-field {
        display: block;
        width: 100%;
        min-height: 52px;
        font-size: 18px;
        --contains-highlight-background-color: #243044;
      }
      /* Hide MathLive menu / virtual-keyboard chrome */
      math-field::part(menu-toggle),
      math-field::part(virtual-keyboard-toggle) {
        display: none !important;
      }
      .expr-field .ML__menu-toggle,
      .expr-field .ML__virtual-keyboard-toggle,
      .expr-field [part="menu-toggle"],
      .expr-field [part="virtual-keyboard-toggle"] {
        display: none !important;
      }
      math-field:focus-within {
        outline: none;
      }
      .expr-row:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(110, 168, 254, 0.35);
      }
      math-field.invalid {
        /* invalid styling applied via row when possible */
      }
      .expr-row:has(math-field.invalid) {
        border-color: #e35d6a;
        box-shadow: 0 0 0 1px rgba(227, 93, 106, 0.35);
        background: transparent;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #0a0c10;
        border-color: transparent;
        font-weight: 600;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--stroke);
        font-weight: 500;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .expr-row.is-param .expr-color {
        opacity: 0.25;
        pointer-events: none;
      }
      .expr-field-row {
        display: flex;
        align-items: stretch;
        min-height: 52px;
        flex: 1 1 auto;
      }
      .expr-field-row .expr-field {
        flex: 1 1 auto;
        min-height: 52px;
      }
      .expr-param-play {
        flex: 0 0 32px;
        width: 32px;
        padding: 0;
        font-size: 12px;
        line-height: 1;
        border: none;
        border-left: 1px solid var(--stroke);
        border-radius: 0;
        background: transparent;
        color: var(--text);
        font-weight: 500;
      }
      .expr-param-play:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .expr-param-play.on {
        background: rgba(110, 168, 254, 0.18);
        color: var(--accent);
      }
      .expr-param-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-top: 1px solid var(--stroke);
        padding-top: 4px;
      }
      .expr-param-head {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 10px;
        min-height: 28px;
      }
      .expr-param-block.is-hosted .expr-param-head {
        justify-content: space-between;
      }
      .expr-param-name {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
      }
      .expr-param-slider {
        width: 100%;
        padding: 0 10px 4px;
        accent-color: var(--accent);
        box-sizing: border-box;
      }
      .expr-param-slider:disabled {
        opacity: 0.45;
      }
      .expr-param-bounds {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        padding: 0 10px 8px;
      }
      .expr-param-bounds label {
        font-size: 10px;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .expr-param-bounds input {
        padding: 4px 6px;
        font-size: 12px;
      }
      .expr-row.is-param.has-error {
        border-color: #e07070;
      }
      .metrics-block {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .metrics-block > summary.metrics-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        list-style: none;
      }
      .metrics-block > summary.metrics-head::-webkit-details-marker {
        display: none;
      }
      .metrics-block .metrics-head span {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .metrics-block button {
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 500;
      }
      .metrics-block[open] #metricsDump {
        margin-top: 6px;
      }
      #metricsDump {
        min-height: 140px;
        max-height: 220px;
        resize: vertical;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.4;
        white-space: pre;
        overflow: auto;
      }
      #viewport {
        position: relative;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        background: #07080b;
      }
      #viewport canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #viewport canvas.clip-gpu {
        pointer-events: none;
        z-index: 1;
      }
      #hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
        z-index: 2;
      }
      #err {
        color: #ff7b72;
        font-size: 12px;
        min-height: 1.2em;
      }
      .march-slider-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .march-scale-badge {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        text-transform: none;
        letter-spacing: 0;
      }
      .march-slider-wrap {
        position: relative;
        margin-top: 2px;
        padding-top: 10px;
      }
      .march-slider-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 8px;
        pointer-events: none;
      }
      .march-slider-ticks span {
        position: absolute;
        left: var(--tick);
        transform: translateX(-50%);
        width: 1px;
        height: 8px;
        background: var(--stroke);
      }
      .march-slider-labels {
        position: relative;
        height: 14px;
        margin-top: 4px;
        font-size: 10px;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      .march-slider-labels span {
        position: absolute;
        transform: translateX(-50%);
        left: var(--tick);
      }
      @media (max-width: 800px) {
        #app {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        #panel {
          border-right: none;
          border-bottom: 1px solid var(--stroke);
          max-height: 42vh;
          width: 100%;
        }
        #panelResize {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <div class="brand">
          <img class="brand-mark" src="/favicon.svg" alt="" width="36" height="36" />
          <h1>Laplacian</h1>
        </div>
        <p class="brand-sub">3D polynomial calculator</p>

        <div class="expr-list-head">
          <span style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em">Expressions</span>
        </div>
        <div id="exprList" class="expr-list"></div>

        <label>
          Load preset
          <select id="preset"></select>
        </label>

        <div class="row3">
          <label>poly deg<input id="deg" type="number" min="2" max="128" step="1" value="20" /></label>
          <label>scale<input id="scale" type="number" min="0.1" max="20" step="0.1" value="2.5" /></label>
          <label>steps<input id="steps" type="number" min="8" max="96" step="4" value="32" /></label>
        </div>

        <label>box size<input id="boxSize" type="number" min="1" max="10" step="0.1" value="4" title="Full edge length of the axis-aligned cube [-S/2,S/2]³" /></label>

        <label class="march-slider-label">
          <span class="march-slider-head">
            <span>march downscale</span>
            <span id="marchScaleLabel" class="march-scale-badge">2×</span>
          </span>
          <div class="march-slider-wrap">
            <div class="march-slider-ticks" id="marchSliderTicks" aria-hidden="true"></div>
            <input id="marchDownscale" type="range" min="1" max="16" step="1" value="2" />
            <div class="march-slider-labels" id="marchSliderLabels" aria-hidden="true"></div>
          </div>
        </label>

        <div class="row">
          <button id="reset" class="secondary" type="button">Reset view</button>
        </div>

        <div id="err"></div>

        <details class="metrics-block">
          <summary class="metrics-head">
            <span>Diagnostics</span>
            <button id="copyMetrics" class="secondary" type="button">Copy</button>
          </summary>
          <textarea id="metricsDump" readonly spellcheck="false"></textarea>
        </details>
      </aside>
      <div
        id="panelResize"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main id="viewport">
        <div id="hud">Laplacian</div>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
