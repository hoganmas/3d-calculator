<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laplacian</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #app {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      #viewport {
        position: absolute;
        inset: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: transparent;
      }
      #panel {
        position: absolute;
        z-index: 5;
        top: var(--panel-inset);
        left: var(--panel-inset);
        bottom: var(--panel-inset);
        width: var(--panel-w);
        max-width: calc(100vw - 2 * var(--panel-inset));
        padding: 12px 12px 16px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
        border-radius: var(--panel-radius);
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        border: none;
        box-shadow: var(--glass-shadow), var(--glass-fresnel);
        transition: box-shadow 0.18s ease;
      }
      #panelResize {
        position: absolute;
        z-index: 6;
        top: var(--panel-inset);
        bottom: var(--panel-inset);
        left: calc(var(--panel-inset) + var(--panel-w) - 6px);
        width: 12px;
        cursor: col-resize;
        background: transparent;
        touch-action: none;
      }
      body.panel-resizing {
        cursor: col-resize;
        user-select: none;
      }
      #panel:has(+ #panelResize:hover),
      body.panel-resizing #panel {
        box-shadow:
          var(--glass-shadow),
          var(--glass-fresnel),
          10px 0 36px var(--accent-ring);
      }
      body.panel-resizing #viewport,
      body.panel-resizing #viewport * {
        pointer-events: none;
      }
      .expr-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 -4px;
        padding: 4px 0 28px;
        min-height: 48px;
        flex: 1;
      }
      .expr-row {
        --expr-c0: #e85a10;
        --expr-c1: #f5d020;
        display: grid;
        grid-template-columns: 16px 28px minmax(0, 1fr) 28px 28px;
        gap: 0;
        align-items: stretch;
        min-height: 52px;
        padding: 0;
        border-radius: 10px;
        border: none;
        background: transparent;
        box-shadow: var(--glass-fresnel-soft);
        overflow: hidden;
        position: relative;
        transition: box-shadow 0.18s ease;
      }
      .expr-row:hover:not(.is-dragging) {
        box-shadow: var(--glass-fresnel);
      }
      .expr-row.selected {
        box-shadow:
          var(--glass-fresnel-soft),
          0 0 0 1px var(--accent-ring),
          0 0 18px var(--accent-ring);
        background: transparent;
      }
      .expr-row.is-dragging {
        opacity: 0.35;
      }
      .expr-row-ghost {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10000;
        margin: 0;
        opacity: 0.78;
        pointer-events: none;
        box-shadow: var(--glass-shadow), var(--glass-fresnel);
        background: var(--glass-bg-strong);
        backdrop-filter: blur(var(--expr-glass-blur)) saturate(1.25);
        -webkit-backdrop-filter: blur(var(--expr-glass-blur)) saturate(1.25);
        will-change: transform;
      }
      .expr-row.drag-over-before::before,
      .expr-row.drag-over-after::after {
        content: "";
        position: absolute;
        left: 4px;
        right: 4px;
        height: 2px;
        border-radius: 1px;
        background: var(--accent);
        pointer-events: none;
        z-index: 2;
      }
      .expr-row.drag-over-before::before {
        top: -1px;
      }
      .expr-row.drag-over-after::after {
        bottom: -1px;
      }
      .expr-list.is-reordering {
        cursor: grabbing;
        user-select: none;
      }
      .expr-drag {
        width: 16px;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        cursor: grab;
        align-self: stretch;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .expr-drag:hover {
        color: var(--text);
        background: transparent;
      }
      .expr-list.is-reordering .expr-drag,
      .expr-drag:active {
        cursor: grabbing;
      }
      .expr-row.is-hidden {
        opacity: 0.45;
      }
      .expr-row.is-hidden .expr-color {
        opacity: 0.5;
      }
      .expr-color {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 10px 5px;
        margin: 0;
        border: none !important;
        border-radius: 0;
        background: transparent !important;
        box-shadow: none !important;
        cursor: pointer;
        align-self: stretch;
        position: relative;
      }
      .expr-color::after {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        min-height: 32px;
        border-radius: 6px;
        background: var(--expr-grad, linear-gradient(
          145deg,
          var(--expr-c0, #e85a10) 0%,
          var(--expr-c1, #f5d020) 100%
        ));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
      }
      .expr-color:hover::after {
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.28),
          0 0 0 1px var(--accent-border);
      }
      .expr-color:disabled {
        cursor: default;
        opacity: 0.35;
      }
      .grad-popover {
        position: fixed;
        z-index: 20000;
        width: 200px;
        padding: 10px;
        border-radius: 12px;
        border: 1px solid var(--glass-stroke);
        background: var(--glass-bg-strong);
        backdrop-filter: blur(18px) saturate(1.2);
        -webkit-backdrop-filter: blur(18px) saturate(1.2);
        box-shadow: var(--glass-shadow-dialog);
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: var(--text);
        font-size: 12px;
      }
      .grad-popover-head {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .grad-popover-preview {
        height: 28px;
        border-radius: 8px;
        border: 1px solid var(--glass-stroke);
      }
      .grad-popover-stops {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 220px;
        overflow: auto;
      }
      .grad-stop {
        display: grid;
        grid-template-columns: 28px 1fr 24px;
        gap: 6px;
        align-items: center;
      }
      .grad-stop-color {
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid var(--glass-stroke);
        border-radius: 6px;
        background: transparent;
        cursor: pointer;
      }
      .grad-stop-color::-webkit-color-swatch-wrapper {
        padding: 2px;
      }
      .grad-stop-color::-webkit-color-swatch {
        border: none;
        border-radius: 4px;
      }
      .grad-stop-label {
        color: var(--muted);
        font-size: 11px;
      }
      .grad-stop-remove {
        width: 24px;
        height: 24px;
        padding: 0;
        border-radius: 6px;
        font-size: 14px;
        line-height: 1;
      }
      .grad-popover-actions {
        display: flex;
        justify-content: stretch;
      }
      .grad-popover-actions button {
        width: 100%;
        font-size: 12px;
        padding: 6px 8px;
      }
      .expr-mid {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        max-width: 100%;
        min-height: 100%;
        overflow: hidden;
      }
      .expr-field {
        flex: 1 1 auto;
        width: 100%;
        max-width: 100%;
        height: auto;
        min-height: 52px;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        padding: 8px 10px;
        overflow: hidden;
      }
      .expr-field:focus-within {
        border: none !important;
        box-shadow: none !important;
      }
      .expr-del {
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        font-size: 16px;
        line-height: 1;
        border: none;
        border-radius: 0;
        background: transparent;
        align-self: stretch;
      }
      .expr-del:hover {
        background: rgba(227, 93, 106, 0.12);
        color: var(--err);
      }
      .expr-vis {
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        align-self: stretch;
        color: var(--muted);
        display: grid;
        place-items: center;
      }
      .expr-vis:hover {
        color: var(--text);
        background: var(--accent-soft);
      }
      .expr-vis svg {
        width: 14px;
        height: 14px;
        display: block;
      }
      .expr-vis.is-off {
        color: var(--stroke);
      }
      #panel .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      #panel .brand-mark {
        width: 36px;
        height: 36px;
        display: block;
        flex-shrink: 0;
        border-radius: 8px;
      }
      #panel h1 {
        font-family: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
        font-size: 26px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.04em;
        line-height: 1.1;
        text-transform: lowercase;
      }
      #panel p {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input,
      select,
      textarea,
      math-field,
      button {
        font: inherit;
        font-size: 13px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        padding: 8px 10px;
      }
      #panel input,
      #panel select,
      #panel textarea,
      #panel math-field,
      #panel button.secondary {
        background: transparent;
      }
      textarea {
        min-height: 64px;
        resize: vertical;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
      }
      math-field {
        display: block;
        width: 100%;
        min-height: 52px;
        font-size: 18px;
        --contains-highlight-background-color: var(--math-highlight);
      }
      /* Hide MathLive menu / virtual-keyboard chrome */
      math-field::part(menu-toggle),
      math-field::part(virtual-keyboard-toggle) {
        display: none !important;
      }
      .expr-field .ML__menu-toggle,
      .expr-field .ML__virtual-keyboard-toggle,
      .expr-field [part="menu-toggle"],
      .expr-field [part="virtual-keyboard-toggle"] {
        display: none !important;
      }
      math-field:focus-within {
        outline: none;
      }
      .expr-row:focus-within {
        border-color: var(--accent-border);
        box-shadow: 0 0 0 1px var(--accent-focus);
        background: transparent;
      }
      math-field.invalid {
        /* invalid styling applied via row when possible */
      }
      .expr-row:has(math-field.invalid) {
        border-color: var(--err-border);
        box-shadow: 0 0 0 1px rgba(227, 93, 106, 0.35);
        background: transparent;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: var(--btn-on-accent);
        border-color: transparent;
        font-weight: 600;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--stroke);
        font-weight: 500;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .expr-row.is-param-def .expr-color,
      .expr-row.is-param-def .expr-vis {
        visibility: hidden;
        pointer-events: none;
      }
      .expr-row.is-param-def .expr-field {
        min-height: 40px;
        padding: 6px 10px 2px;
      }
      .expr-field-row {
        display: flex;
        align-items: stretch;
        min-height: 40px;
        flex: 1 1 auto;
        min-width: 0;
        max-width: 100%;
      }
      .expr-field-row .expr-field {
        flex: 1 1 auto;
        min-height: 40px;
        min-width: 0;
      }
      .expr-param-block {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 8px 10px 10px;
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }
      .expr-param-block.is-hosted {
        border-top: 1px solid var(--stroke);
        padding-top: 8px;
      }
      .expr-param-name {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        flex: 0 0 auto;
      }
      .expr-param-rail {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto 28px;
        align-items: center;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
      }
      .expr-param-min,
      .expr-param-max {
        width: 2.6em;
        min-width: 2.2em;
        padding: 0;
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .expr-param-min:focus,
      .expr-param-max:focus {
        color: var(--text);
        outline: none;
        border-bottom: 1px solid var(--accent) !important;
        border-radius: 0 !important;
      }
      .expr-param-play {
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }
      .expr-param-play:hover {
        background: var(--accent-soft);
      }
      .expr-param-play:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .expr-param-play.on {
        background: var(--accent-soft-strong);
        color: var(--accent);
      }
      .expr-param-track {
        position: relative;
        height: 24px;
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .expr-param-zero {
        position: absolute;
        top: 50%;
        width: 3px;
        height: 3px;
        margin-left: -1.5px;
        margin-top: -1.5px;
        border-radius: 50%;
        background: var(--glass-rim);
        box-shadow: 0 0 0 1px var(--glass-rim-outer);
        pointer-events: none;
        z-index: 0;
        opacity: 0.85;
      }
      /* Glass range controls (expr params + settings) */
      .expr-param-slider,
      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 24px;
        margin: 0;
        padding: 0;
        background: transparent;
        border: none;
        border-radius: 0;
        cursor: pointer;
        position: relative;
        z-index: 1;
      }
      .expr-param-slider:disabled,
      input[type="range"]:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .expr-param-slider::-webkit-slider-runnable-track,
      input[type="range"]::-webkit-slider-runnable-track {
        height: 8px;
        border-radius: 999px;
        background: var(--glass-bg-elevated);
        border: none;
        box-shadow:
          inset 0 1px 0 var(--glass-highlight),
          inset 0 0 0 1px var(--glass-rim-soft),
          inset 0 0 10px 1px rgba(255, 230, 210, 0.06),
          0 0 0 1px var(--glass-rim-outer);
      }
      .expr-param-slider::-moz-range-track,
      input[type="range"]::-moz-range-track {
        height: 8px;
        border-radius: 999px;
        background: var(--glass-bg-elevated);
        border: none;
        box-shadow:
          inset 0 1px 0 var(--glass-highlight),
          inset 0 0 0 1px var(--glass-rim-soft),
          0 0 0 1px var(--glass-rim-outer);
      }
      .expr-param-slider::-moz-range-progress,
      input[type="range"]::-moz-range-progress {
        height: 8px;
        border-radius: 999px;
        background: var(--accent-soft-strong);
        border: none;
        box-shadow: inset 0 1px 0 var(--glass-highlight);
      }
      .expr-param-slider::-webkit-slider-thumb,
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -4px;
        border-radius: 50%;
        background:
          linear-gradient(
            160deg,
            rgba(255, 245, 235, 0.55) 0%,
            var(--accent-soft-strong) 42%,
            var(--accent) 100%
          );
        border: 1px solid var(--glass-rim);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 245, 235, 0.65),
          inset 0 -1px 0 rgba(0, 0, 0, 0.12),
          0 0 0 1px var(--glass-rim-outer),
          0 2px 10px rgba(12, 4, 28, 0.28),
          0 0 12px var(--accent-ring);
        cursor: pointer;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      .expr-param-slider::-moz-range-thumb,
      input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background:
          linear-gradient(
            160deg,
            rgba(255, 245, 235, 0.55) 0%,
            var(--accent-soft-strong) 42%,
            var(--accent) 100%
          );
        border: 1px solid var(--glass-rim);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 245, 235, 0.65),
          inset 0 -1px 0 rgba(0, 0, 0, 0.12),
          0 0 0 1px var(--glass-rim-outer),
          0 2px 10px rgba(12, 4, 28, 0.28),
          0 0 12px var(--accent-ring);
        cursor: pointer;
      }
      .expr-param-slider:hover::-webkit-slider-thumb,
      input[type="range"]:hover::-webkit-slider-thumb {
        transform: scale(1.06);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 245, 235, 0.72),
          inset 0 -1px 0 rgba(0, 0, 0, 0.1),
          0 0 0 1px var(--glass-rim-outer),
          0 3px 14px rgba(12, 4, 28, 0.32),
          0 0 16px var(--accent-focus);
      }
      .expr-param-slider:hover::-moz-range-thumb,
      input[type="range"]:hover::-moz-range-thumb {
        box-shadow:
          inset 0 1.5px 0 rgba(255, 245, 235, 0.72),
          inset 0 -1px 0 rgba(0, 0, 0, 0.1),
          0 0 0 1px var(--glass-rim-outer),
          0 3px 14px rgba(12, 4, 28, 0.32),
          0 0 16px var(--accent-focus);
      }
      .expr-param-slider:focus,
      input[type="range"]:focus {
        outline: none;
      }
      .expr-param-slider:focus-visible::-webkit-slider-thumb,
      input[type="range"]:focus-visible::-webkit-slider-thumb {
        box-shadow:
          inset 0 1.5px 0 rgba(255, 245, 235, 0.72),
          0 0 0 2px var(--bg),
          0 0 0 4px var(--accent-border),
          0 2px 10px rgba(12, 4, 28, 0.28);
      }
      .expr-param-slider:focus-visible::-moz-range-thumb,
      input[type="range"]:focus-visible::-moz-range-thumb {
        box-shadow:
          inset 0 1.5px 0 rgba(255, 245, 235, 0.72),
          0 0 0 2px var(--bg),
          0 0 0 4px var(--accent-border),
          0 2px 10px rgba(12, 4, 28, 0.28);
      }
      [data-theme="light"] .expr-param-slider::-webkit-slider-thumb,
      [data-theme="light"] input[type="range"]::-webkit-slider-thumb,
      [data-theme="light"] .expr-param-slider::-moz-range-thumb,
      [data-theme="light"] input[type="range"]::-moz-range-thumb {
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.85),
          inset 0 -1px 0 rgba(80, 50, 30, 0.08),
          0 0 0 1px var(--glass-rim-outer),
          0 2px 8px rgba(80, 50, 30, 0.16),
          0 0 10px var(--accent-ring);
      }
      .expr-row.has-error {
        border-color: #e07070;
      }
      .metrics-block {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .metrics-block > summary.metrics-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        list-style: none;
      }
      .metrics-block > summary.metrics-head::-webkit-details-marker {
        display: none;
      }
      .metrics-block .metrics-head span {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .metrics-block button {
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 500;
      }
      .metrics-block[open] #metricsDump {
        margin-top: 6px;
      }
      #metricsDump {
        min-height: 140px;
        max-height: 220px;
        resize: vertical;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.4;
        white-space: pre;
        overflow: auto;
      }
      .brand-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .brand-row-actions {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }
      .icon-btn {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--stroke);
        border-radius: 8px;
        font-weight: 500;
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: var(--accent-border);
        background: var(--accent-soft);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .settings-dialog {
        border: none;
        border-radius: 16px;
        padding: 0;
        background: var(--glass-bg-strong);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        color: var(--text);
        max-width: min(440px, calc(100vw - 28px));
        width: 100%;
        max-height: min(88vh, 720px);
        overflow: hidden;
        box-shadow: var(--glass-shadow-dialog), var(--glass-fresnel);
      }
      .settings-dialog::backdrop {
        background: var(--dialog-backdrop);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .settings-sheet {
        display: flex;
        flex-direction: column;
        max-height: min(88vh, 720px);
      }
      .settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--stroke);
      }
      .settings-head h2 {
        margin: 0;
        font-family: "Space Grotesk", "IBM Plex Sans", system-ui, sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .settings-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 16px 18px;
        overflow: auto;
      }
      .settings-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .settings-section-title {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .settings-dialog label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .settings-dialog input,
      .settings-dialog select,
      .settings-dialog textarea,
      .settings-dialog button.secondary {
        font: inherit;
        font-size: 13px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        padding: 8px 10px;
      }
      .settings-dialog input[type="range"] {
        border: none;
        border-radius: 0;
        padding: 0;
        background: transparent;
        box-shadow: none;
      }
      .settings-dialog .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      #viewport canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #viewport canvas.clip-gpu {
        pointer-events: none;
        z-index: 1;
      }
      #viewport canvas.axis-labels {
        pointer-events: none;
        z-index: 2;
      }
      #hud {
        position: absolute;
        left: calc(var(--panel-inset) + var(--panel-w) + 16px);
        bottom: 12px;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
        z-index: 2;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: none;
        box-shadow: var(--glass-fresnel-soft);
      }
      #err {
        color: var(--err);
        font-size: 12px;
        min-height: 1.2em;
      }
      .march-slider-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .march-scale-badge {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        text-transform: none;
        letter-spacing: 0;
      }
      .march-slider-wrap {
        position: relative;
        margin-top: 2px;
        padding-top: 10px;
      }
      .march-slider-wrap .ui-slider {
        display: block;
      }
      .march-slider-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 8px;
        pointer-events: none;
      }
      .march-slider-ticks span {
        position: absolute;
        left: var(--tick);
        transform: translateX(-50%);
        width: 1px;
        height: 8px;
        background: var(--stroke);
      }
      .march-slider-labels {
        position: relative;
        height: 14px;
        margin-top: 4px;
        font-size: 10px;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      .march-slider-labels span {
        position: absolute;
        transform: translateX(-50%);
        left: var(--tick);
      }
      @media (max-width: 800px) {
        #panel {
          top: 8px;
          left: 8px;
          right: 8px;
          bottom: auto;
          width: auto;
          max-height: 42vh;
        }
        #panelResize {
          display: none;
        }
        #hud {
          left: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <div class="brand-row">
          <div class="brand">
            <img class="brand-mark" src="/favicon.svg" alt="" width="36" height="36" />
            <h1>Laplacian</h1>
          </div>
          <div class="brand-row-actions">
            <button
              id="reset"
              class="icon-btn"
              type="button"
              aria-label="Reset view"
              title="Reset view"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="12" cy="12" r="3" />
                <path stroke-linecap="round" d="M12 2v4M12 18v4M2 12h4M18 12h4" />
              </svg>
            </button>
            <button
              id="openSettings"
              class="icon-btn"
              type="button"
              aria-label="Open settings"
              title="Settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="12" cy="12" r="3" />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div id="exprList" class="expr-list" aria-label="Expressions"></div>

        <div id="err"></div>
      </aside>
      <div
        id="panelResize"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main id="viewport">
        <div id="hud">Laplacian</div>
      </main>
    </div>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <div class="settings-sheet">
        <header class="settings-head">
          <h2 id="settingsTitle">Settings</h2>
          <button id="closeSettings" class="icon-btn" type="button" aria-label="Close settings" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="settings-body">
          <section class="settings-section">
            <p class="settings-section-title">Appearance</p>
            <label>
              Theme
              <select id="themePref">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="system">System</option>
              </select>
            </label>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Scene</p>
            <label>
              Load preset
              <select id="preset"></select>
            </label>
            <label>box size<input id="boxSize" type="number" min="1" max="10" step="0.1" value="5" title="Full edge length of the axis-aligned cube [-S/2,S/2]³" /></label>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Approximation</p>
            <div class="row3">
              <label>poly deg<input id="deg" type="number" min="2" max="128" step="1" value="30" /></label>
              <label>scale<input id="scale" type="number" min="0.1" max="20" step="0.1" value="2.5" /></label>
              <label>steps<input id="steps" type="number" min="8" max="96" step="4" value="32" /></label>
            </div>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Rendering</p>
            <label class="march-slider-label">
              <span class="march-slider-head">
                <span>march downscale</span>
                <span id="marchScaleLabel" class="march-scale-badge">1×</span>
              </span>
              <div class="march-slider-wrap">
                <div class="march-slider-ticks" id="marchSliderTicks" aria-hidden="true"></div>
                <input id="marchDownscale" class="ui-slider" type="range" min="1" max="16" step="1" value="1" />
                <div class="march-slider-labels" id="marchSliderLabels" aria-hidden="true"></div>
              </div>
            </label>
          </section>

          <section class="settings-section">
            <details class="metrics-block" open>
              <summary class="metrics-head">
                <span>Diagnostics</span>
                <button id="copyMetrics" class="secondary" type="button">Copy</button>
              </summary>
              <textarea id="metricsDump" readonly spellcheck="false"></textarea>
            </details>
          </section>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
