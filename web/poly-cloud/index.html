<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laplacian</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Latin Modern = Computer Modern OpenType (standard LaTeX text face) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/sugina-dev/latin-modern-web@1.0.1/style/latinmodern-roman.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1014;
        --panel: #161a22;
        --panel-inset: 12px;
        --panel-radius: 16px;
        --glass-bg: rgba(14, 17, 24, 0.48);
        --glass-bg-strong: rgba(18, 22, 30, 0.62);
        --glass-stroke: rgba(255, 255, 255, 0.12);
        --glass-highlight: rgba(255, 255, 255, 0.07);
        --glass-blur: 22px;
        --stroke: rgba(255, 255, 255, 0.12);
        --text: #e8eaed;
        --muted: #9aa3b2;
        --accent: #6ea8fe;
        --ok: #3dd68c;
        --warn: #f5a524;
        --panel-w: 360px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: Georgia, "Times New Roman", Times, serif;
        background: var(--bg);
        color: var(--text);
      }
      #app {
        position: relative;
        height: 100%;
        overflow: hidden;
      }
      #viewport {
        position: absolute;
        inset: 0;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background: #07080b;
      }
      #panel {
        position: absolute;
        z-index: 5;
        top: var(--panel-inset);
        left: var(--panel-inset);
        bottom: var(--panel-inset);
        width: var(--panel-w);
        max-width: calc(100vw - 2 * var(--panel-inset));
        padding: 12px 12px 16px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
        border-radius: var(--panel-radius);
        background: var(--glass-bg);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        border: 1px solid var(--glass-stroke);
        box-shadow:
          0 16px 48px rgba(0, 0, 0, 0.38),
          inset 0 1px 0 var(--glass-highlight);
      }
      #panelResize {
        position: absolute;
        z-index: 6;
        top: var(--panel-inset);
        bottom: var(--panel-inset);
        left: calc(var(--panel-inset) + var(--panel-w) - 2px);
        width: 6px;
        cursor: col-resize;
        background: transparent;
        border-radius: 3px;
        touch-action: none;
      }
      #panelResize::after {
        content: "";
        position: absolute;
        inset: 0 -4px;
      }
      #panelResize:hover,
      #panelResize.dragging {
        background: rgba(110, 168, 254, 0.45);
      }
      body.panel-resizing {
        cursor: col-resize;
        user-select: none;
      }
      body.panel-resizing #viewport,
      body.panel-resizing #viewport * {
        pointer-events: none;
      }
      .expr-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin: 0 -4px;
        padding: 10px 0 28px;
        min-height: 48px;
      }
      .expr-row {
        display: grid;
        grid-template-columns: 16px 28px minmax(0, 1fr) 28px 28px;
        gap: 0;
        align-items: stretch;
        min-height: 52px;
        padding: 0;
        border-radius: 8px;
        border: 1px solid var(--glass-stroke);
        background: rgba(255, 255, 255, 0.04);
        overflow: hidden;
        position: relative;
      }
      .expr-row.selected {
        border-color: rgba(110, 168, 254, 0.55);
        box-shadow: 0 0 0 1px rgba(110, 168, 254, 0.2);
        background: rgba(110, 168, 254, 0.08);
      }
      .expr-row.is-dragging {
        opacity: 0.35;
      }
      .expr-row-ghost {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 10000;
        margin: 0;
        opacity: 0.72;
        pointer-events: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        background: var(--glass-bg-strong);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        will-change: transform;
      }
      .expr-row.drag-over-before::before,
      .expr-row.drag-over-after::after {
        content: "";
        position: absolute;
        left: 4px;
        right: 4px;
        height: 2px;
        border-radius: 1px;
        background: var(--accent);
        pointer-events: none;
        z-index: 2;
      }
      .expr-row.drag-over-before::before {
        top: -1px;
      }
      .expr-row.drag-over-after::after {
        bottom: -1px;
      }
      .expr-list.is-reordering {
        cursor: grabbing;
        user-select: none;
      }
      .expr-drag {
        width: 16px;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        cursor: grab;
        align-self: stretch;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }
      .expr-drag:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.04);
      }
      .expr-list.is-reordering .expr-drag,
      .expr-drag:active {
        cursor: grabbing;
      }
      .expr-row.is-hidden {
        opacity: 0.45;
      }
      .expr-row.is-hidden .expr-color {
        opacity: 0.5;
      }
      .expr-color {
        -webkit-appearance: none;
        appearance: none;
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        margin: 0;
        border: none !important;
        border-radius: 0;
        background: transparent !important;
        box-shadow: none !important;
        cursor: pointer;
        align-self: stretch;
      }
      .expr-color::-webkit-color-swatch-wrapper {
        padding: 10px 5px;
        background: transparent;
      }
      .expr-color::-webkit-color-swatch {
        border: none;
        border-radius: 6px;
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.18),
          0 0 0 1px rgba(0, 0, 0, 0.25);
      }
      .expr-color:hover::-webkit-color-swatch {
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.28),
          0 0 0 1px rgba(110, 168, 254, 0.35);
      }
      .expr-color::-moz-color-swatch {
        border: none;
        border-radius: 6px;
      }
      .expr-color:disabled {
        cursor: default;
        opacity: 0.35;
      }
      .expr-mid {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        max-width: 100%;
        min-height: 100%;
        overflow: hidden;
      }
      .expr-field {
        flex: 1 1 auto;
        width: 100%;
        max-width: 100%;
        height: auto;
        min-height: 52px;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        background: transparent !important;
        padding: 8px 10px;
        overflow: hidden;
      }
      .expr-field:focus-within {
        border: none !important;
        box-shadow: none !important;
      }
      .expr-del {
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        font-size: 16px;
        line-height: 1;
        border: none;
        border-radius: 0;
        background: transparent;
        align-self: stretch;
      }
      .expr-del:hover {
        background: rgba(227, 93, 106, 0.12);
        color: #ff7b72;
      }
      .expr-vis {
        width: 28px;
        height: auto;
        min-height: 100%;
        padding: 0;
        border: none;
        border-radius: 0;
        background: transparent;
        align-self: stretch;
        color: var(--muted);
        display: grid;
        place-items: center;
      }
      .expr-vis:hover {
        color: var(--text);
        background: rgba(110, 168, 254, 0.1);
      }
      .expr-vis svg {
        width: 14px;
        height: 14px;
        display: block;
      }
      .expr-vis.is-off {
        color: var(--stroke);
      }
      #panel .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 2px 0 0;
      }
      #panel .brand-mark {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        border-radius: 8px;
      }
      #panel h1 {
        font-family: "Latin Modern Roman", "Computer Modern Serif", Georgia, serif;
        font-size: 26px;
        font-weight: bold;
        margin: 0;
        letter-spacing: 0.01em;
        line-height: 1.1;
      }
      #panel .brand-sub {
        margin: 2px 0 4px 48px;
        font-family: "Latin Modern Roman", "Computer Modern Serif", Georgia, serif;
        font-size: 12px;
        color: var(--muted);
      }
      #panel p {
        margin: 0;
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input,
      select,
      textarea,
      math-field,
      button {
        font: inherit;
        font-size: 13px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        padding: 8px 10px;
      }
      #panel input,
      #panel select,
      #panel textarea,
      #panel math-field,
      #panel button.secondary {
        background: transparent;
      }
      textarea {
        min-height: 64px;
        resize: vertical;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
      }
      math-field {
        display: block;
        width: 100%;
        min-height: 52px;
        font-size: 18px;
        --contains-highlight-background-color: #243044;
      }
      /* Hide MathLive menu / virtual-keyboard chrome */
      math-field::part(menu-toggle),
      math-field::part(virtual-keyboard-toggle) {
        display: none !important;
      }
      .expr-field .ML__menu-toggle,
      .expr-field .ML__virtual-keyboard-toggle,
      .expr-field [part="menu-toggle"],
      .expr-field [part="virtual-keyboard-toggle"] {
        display: none !important;
      }
      math-field:focus-within {
        outline: none;
      }
      .expr-row:focus-within {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px rgba(110, 168, 254, 0.35);
      }
      math-field.invalid {
        /* invalid styling applied via row when possible */
      }
      .expr-row:has(math-field.invalid) {
        border-color: #e35d6a;
        box-shadow: 0 0 0 1px rgba(227, 93, 106, 0.35);
        background: transparent;
      }
      button {
        cursor: pointer;
        background: var(--accent);
        color: #0a0c10;
        border-color: transparent;
        font-weight: 600;
      }
      button.secondary {
        background: transparent;
        color: var(--text);
        border-color: var(--stroke);
        font-weight: 500;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .expr-row.is-param-def .expr-color,
      .expr-row.is-param-def .expr-vis {
        visibility: hidden;
        pointer-events: none;
      }
      .expr-row.is-param-def .expr-field {
        min-height: 40px;
        padding: 6px 10px 2px;
      }
      .expr-field-row {
        display: flex;
        align-items: stretch;
        min-height: 40px;
        flex: 1 1 auto;
        min-width: 0;
        max-width: 100%;
      }
      .expr-field-row .expr-field {
        flex: 1 1 auto;
        min-height: 40px;
        min-width: 0;
      }
      .expr-param-block {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 8px 10px 10px;
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
      }
      .expr-param-block.is-hosted {
        border-top: 1px solid var(--stroke);
        padding-top: 8px;
      }
      .expr-param-name {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        flex: 0 0 auto;
      }
      .expr-param-rail {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto 28px;
        align-items: center;
        gap: 6px;
        flex: 1 1 auto;
        min-width: 0;
        width: 100%;
      }
      .expr-param-min,
      .expr-param-max {
        width: 2.6em;
        min-width: 2.2em;
        padding: 0;
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .expr-param-min:focus,
      .expr-param-max:focus {
        color: var(--text);
        outline: none;
        border-bottom: 1px solid var(--accent) !important;
        border-radius: 0 !important;
      }
      .expr-param-play {
        width: 28px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 4px;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
      }
      .expr-param-play:hover {
        background: rgba(110, 168, 254, 0.12);
      }
      .expr-param-play:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .expr-param-play.on {
        background: rgba(110, 168, 254, 0.18);
        color: var(--accent);
      }
      .expr-param-track {
        position: relative;
        height: 22px;
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .expr-param-zero {
        position: absolute;
        top: 50%;
        width: 4px;
        height: 4px;
        margin-left: -2px;
        margin-top: -2px;
        border-radius: 50%;
        background: var(--muted);
        pointer-events: none;
        z-index: 0;
      }
      .expr-param-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 22px;
        margin: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
        position: relative;
        z-index: 1;
      }
      .expr-param-slider:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .expr-param-slider::-webkit-slider-runnable-track {
        height: 2px;
        background: var(--stroke);
        border-radius: 1px;
      }
      .expr-param-slider::-moz-range-track {
        height: 2px;
        background: var(--stroke);
        border-radius: 1px;
        border: none;
      }
      .expr-param-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 12px;
        height: 12px;
        margin-top: -5px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        box-shadow: 0 0 0 6px rgba(110, 168, 254, 0.28);
        cursor: pointer;
      }
      .expr-param-slider::-moz-range-thumb {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        box-shadow: 0 0 0 6px rgba(110, 168, 254, 0.28);
        cursor: pointer;
      }
      .expr-param-slider:focus {
        outline: none;
      }
      .expr-param-slider:focus::-webkit-slider-thumb {
        box-shadow: 0 0 0 7px rgba(110, 168, 254, 0.35);
      }
      .expr-row.has-error {
        border-color: #e07070;
      }
      .metrics-block {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .metrics-block > summary.metrics-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        list-style: none;
      }
      .metrics-block > summary.metrics-head::-webkit-details-marker {
        display: none;
      }
      .metrics-block .metrics-head span {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .metrics-block button {
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 500;
      }
      .metrics-block[open] #metricsDump {
        margin-top: 6px;
      }
      #metricsDump {
        min-height: 140px;
        max-height: 220px;
        resize: vertical;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 11px;
        line-height: 1.4;
        white-space: pre;
        overflow: auto;
      }
      .brand-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .brand-row .brand {
        flex: 1;
        min-width: 0;
      }
      .icon-btn {
        flex-shrink: 0;
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--stroke);
        border-radius: 8px;
        font-weight: 500;
      }
      .icon-btn:hover {
        color: var(--text);
        border-color: rgba(110, 168, 254, 0.45);
        background: rgba(110, 168, 254, 0.08);
      }
      .icon-btn svg {
        width: 18px;
        height: 18px;
        display: block;
      }
      .panel-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .settings-dialog {
        border: 1px solid var(--glass-stroke);
        border-radius: 16px;
        padding: 0;
        background: var(--glass-bg-strong);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.35);
        color: var(--text);
        max-width: min(440px, calc(100vw - 28px));
        width: 100%;
        max-height: min(88vh, 720px);
        overflow: hidden;
        box-shadow:
          0 18px 48px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 var(--glass-highlight);
      }
      .settings-dialog::backdrop {
        background: rgba(6, 8, 12, 0.45);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .settings-sheet {
        display: flex;
        flex-direction: column;
        max-height: min(88vh, 720px);
      }
      .settings-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--stroke);
      }
      .settings-head h2 {
        margin: 0;
        font-family: "Latin Modern Roman", "Computer Modern Serif", Georgia, serif;
        font-size: 20px;
        font-weight: bold;
        letter-spacing: 0.01em;
      }
      .settings-body {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px 16px 18px;
        overflow: auto;
      }
      .settings-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .settings-section-title {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .settings-dialog label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .settings-dialog input,
      .settings-dialog select,
      .settings-dialog textarea,
      .settings-dialog button.secondary {
        font: inherit;
        font-size: 13px;
        text-transform: none;
        letter-spacing: 0;
        color: var(--text);
        background: transparent;
        border: 1px solid var(--stroke);
        border-radius: 4px;
        padding: 8px 10px;
      }
      .settings-dialog .row3 {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      #viewport canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #viewport canvas.clip-gpu {
        pointer-events: none;
        z-index: 1;
      }
      #hud {
        position: absolute;
        left: calc(var(--panel-inset) + var(--panel-w) + 16px);
        bottom: 12px;
        font-size: 11px;
        color: var(--muted);
        pointer-events: none;
        z-index: 2;
        padding: 6px 10px;
        border-radius: 8px;
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-stroke);
      }
      #err {
        color: #ff7b72;
        font-size: 12px;
        min-height: 1.2em;
      }
      .march-slider-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .march-scale-badge {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
        text-transform: none;
        letter-spacing: 0;
      }
      .march-slider-wrap {
        position: relative;
        margin-top: 2px;
        padding-top: 10px;
      }
      .march-slider-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 8px;
        pointer-events: none;
      }
      .march-slider-ticks span {
        position: absolute;
        left: var(--tick);
        transform: translateX(-50%);
        width: 1px;
        height: 8px;
        background: var(--stroke);
      }
      .march-slider-labels {
        position: relative;
        height: 14px;
        margin-top: 4px;
        font-size: 10px;
        color: var(--muted);
        text-transform: none;
        letter-spacing: 0;
        font-variant-numeric: tabular-nums;
      }
      .march-slider-labels span {
        position: absolute;
        transform: translateX(-50%);
        left: var(--tick);
      }
      @media (max-width: 800px) {
        #panel {
          top: 8px;
          left: 8px;
          right: 8px;
          bottom: auto;
          width: auto;
          max-height: 42vh;
        }
        #panelResize {
          display: none;
        }
        #hud {
          left: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <div class="brand-row">
          <div>
            <div class="brand">
              <img class="brand-mark" src="/favicon.svg" alt="" width="36" height="36" />
              <h1>Laplacian</h1>
            </div>
            <p class="brand-sub">3D polynomial calculator</p>
          </div>
          <button
            id="openSettings"
            class="icon-btn"
            type="button"
            aria-label="Open settings"
            title="Settings"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
              <circle cx="12" cy="12" r="3" />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
        </div>

        <div class="expr-list-head">
          <span style="font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em">Expressions</span>
        </div>
        <div id="exprList" class="expr-list"></div>

        <div class="panel-actions">
          <button id="reset" class="secondary" type="button">Reset view</button>
        </div>

        <div id="err"></div>
      </aside>
      <div
        id="panelResize"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main id="viewport">
        <div id="hud">Laplacian</div>
      </main>
    </div>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <div class="settings-sheet">
        <header class="settings-head">
          <h2 id="settingsTitle">Settings</h2>
          <button id="closeSettings" class="icon-btn" type="button" aria-label="Close settings" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="settings-body">
          <section class="settings-section">
            <p class="settings-section-title">Scene</p>
            <label>
              Load preset
              <select id="preset"></select>
            </label>
            <label>box size<input id="boxSize" type="number" min="1" max="10" step="0.1" value="4" title="Full edge length of the axis-aligned cube [-S/2,S/2]³" /></label>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Approximation</p>
            <div class="row3">
              <label>poly deg<input id="deg" type="number" min="2" max="128" step="1" value="20" /></label>
              <label>scale<input id="scale" type="number" min="0.1" max="20" step="0.1" value="2.5" /></label>
              <label>steps<input id="steps" type="number" min="8" max="96" step="4" value="32" /></label>
            </div>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Rendering</p>
            <label class="march-slider-label">
              <span class="march-slider-head">
                <span>march downscale</span>
                <span id="marchScaleLabel" class="march-scale-badge">1×</span>
              </span>
              <div class="march-slider-wrap">
                <div class="march-slider-ticks" id="marchSliderTicks" aria-hidden="true"></div>
                <input id="marchDownscale" type="range" min="1" max="16" step="1" value="1" />
                <div class="march-slider-labels" id="marchSliderLabels" aria-hidden="true"></div>
              </div>
            </label>
          </section>

          <section class="settings-section">
            <details class="metrics-block" open>
              <summary class="metrics-head">
                <span>Diagnostics</span>
                <button id="copyMetrics" class="secondary" type="button">Copy</button>
              </summary>
              <textarea id="metricsDump" readonly spellcheck="false"></textarea>
            </details>
          </section>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
