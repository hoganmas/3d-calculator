<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laplacian</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/src/ui/app.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <div class="brand-row">
          <div class="brand">
            <img class="brand-mark" src="/favicon.svg" alt="" width="36" height="36" />
            <h1>Laplacian</h1>
          </div>
          <div class="brand-row-actions">
            <button
              id="reset"
              class="icon-btn has-tooltip"
              type="button"
              aria-label="Focus view"
              data-tooltip="Focus view"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="12" cy="12" r="3" />
                <path stroke-linecap="round" d="M12 2v4M12 18v4M2 12h4M18 12h4" />
              </svg>
            </button>
            <button
              id="openWebmcpSetup"
              class="icon-btn has-tooltip"
              type="button"
              aria-label="Setup MCP"
              data-tooltip="Setup MCP"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
                <path
                  d="M13.85 0a4.16 4.16 0 0 0-2.95 1.217L1.456 10.66a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l9.442-9.442a2.49 2.49 0 0 1 3.541 0 2.49 2.49 0 0 1 0 3.541L8.59 12.97l-.1.1a.835.835 0 0 0 0 1.18.835.835 0 0 0 1.18 0l.1-.098 7.03-7.034a2.49 2.49 0 0 1 3.542 0l.049.05a2.49 2.49 0 0 1 0 3.54l-8.54 8.54a1.96 1.96 0 0 0 0 2.755l1.753 1.753a.835.835 0 0 0 1.18 0 .835.835 0 0 0 0-1.18l-1.753-1.753a.266.266 0 0 1 0-.394l8.54-8.54a4.185 4.185 0 0 0 0-5.9l-.05-.05a4.16 4.16 0 0 0-2.95-1.218c-.2 0-.401.02-.6.048a4.17 4.17 0 0 0-1.17-3.552A4.16 4.16 0 0 0 13.85 0m0 3.333a.84.84 0 0 0-.59.245L6.275 10.56a4.186 4.186 0 0 0 0 5.902 4.186 4.186 0 0 0 5.902 0L19.16 9.48a.835.835 0 0 0 0-1.18.835.835 0 0 0-1.18 0l-6.985 6.984a2.49 2.49 0 0 1-3.54 0 2.49 2.49 0 0 1 0-3.54l6.983-6.985a.835.835 0 0 0 0-1.18.84.84 0 0 0-.59-.245"
                />
              </svg>
            </button>
            <button
              id="openSettings"
              class="icon-btn has-tooltip"
              type="button"
              aria-label="Settings"
              data-tooltip="Settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
                <circle cx="12" cy="12" r="3" />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 15 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div id="exprList" class="expr-list" aria-label="Expressions"></div>

        <div id="err"></div>
      </aside>
      <div
        id="panelResize"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize sidebar"
        tabindex="0"
      ></div>
      <main id="viewport">
        <div id="hud">Laplacian</div>
      </main>
    </div>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <div class="settings-sheet">
        <header class="settings-head">
          <h2 id="settingsTitle">Settings</h2>
          <button id="closeSettings" class="icon-btn" type="button" aria-label="Close settings" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="settings-body">
          <section class="settings-section">
            <p class="settings-section-title">Appearance</p>
            <label>
              Theme
              <select id="themePref">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
                <option value="system">System</option>
              </select>
            </label>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Scene</p>
            <label>
              Load preset
              <select id="preset"></select>
            </label>
            <label>box size<input id="boxSize" type="number" min="1" max="10" step="0.1" value="5" title="Full edge length of the axis-aligned cube [-S/2,S/2]³" /></label>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Approximation</p>
            <div class="row3">
              <label>poly deg<input id="deg" type="number" min="2" max="128" step="1" value="23" /></label>
              <label>scale<input id="scale" type="number" min="0.1" max="20" step="0.1" value="2.5" /></label>
              <label>steps<input id="steps" type="number" min="8" max="96" step="4" value="16" /></label>
            </div>
          </section>

          <section class="settings-section">
            <p class="settings-section-title">Rendering</p>
            <label>
              iso interpolation
              <select id="isoInterp" title="Trilinear is faster; tricubic Hermite is C¹ using dens+∇ slabs">
                <option value="trilinear">trilinear</option>
                <option value="hermite" selected>tricubic Hermite</option>
              </select>
            </label>
            <label class="march-slider-label">
              <span class="march-slider-head">
                <span>march downscale</span>
                <span id="marchScaleLabel" class="march-scale-badge">1×</span>
              </span>
              <div class="march-slider-wrap">
                <div class="march-slider-ticks" id="marchSliderTicks" aria-hidden="true"></div>
                <div class="march-liquid-track">
                  <input id="marchDownscale" class="ui-slider" type="range" min="1" max="16" step="1" value="2" />
                </div>
                <div class="march-slider-labels" id="marchSliderLabels" aria-hidden="true"></div>
              </div>
            </label>
          </section>

          <section class="settings-section">
            <details class="metrics-block" open>
              <summary class="metrics-head">
                <span>Diagnostics</span>
                <button id="copyMetrics" class="secondary" type="button">Copy</button>
              </summary>
              <textarea id="metricsDump" readonly spellcheck="false"></textarea>
            </details>
          </section>
        </div>
      </div>
    </dialog>

    <dialog id="webmcpSetupDialog" class="settings-dialog webmcp-setup-dialog" aria-labelledby="webmcpSetupTitle">
      <div class="settings-sheet">
        <header class="settings-head">
          <h2 id="webmcpSetupTitle">MCP Setup</h2>
          <button id="closeWebmcpSetup" class="icon-btn" type="button" aria-label="Close" title="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75">
              <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </header>
        <div class="settings-body">
          <p class="webmcp-setup-lead">
            Laplacian lets external agents help you write expressions and tune render settings.
          </p>
          <label>
            MCP config
            <textarea id="webmcpConfigSnippet" class="webmcp-config-snippet" readonly spellcheck="false" rows="14"></textarea>
          </label>
          <div class="webmcp-setup-actions">
            <button id="copyWebmcpConfig" class="secondary" type="button">Copy config</button>
          </div>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
